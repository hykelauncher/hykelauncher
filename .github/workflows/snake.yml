name: Generate Snake Animation

# ─── Triggers ──────────────────────────────────────────────────────
on:
  workflow_dispatch:           # run it manually the first time
  schedule:
    - cron: "0 0 * * *"        # then run every midnight (UTC)

# ─── Make the token powerful enough to push ────────────────────────
permissions:
  contents: write              # allow the job to create / update branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Generate the SVGs
      - name: Generate snake
        uses: Platane/snk@v3.1.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2️⃣ Push them to the `output` branch
      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
