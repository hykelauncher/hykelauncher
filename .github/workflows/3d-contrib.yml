name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"  # Daily, an hour after the snake
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: write

# Shared with the other workflows that commit to master, so they queue instead
# of racing each other's pushes.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Additive pass: same night view, plus a snake gliding over it. Writes a
      # new file, so the original stays exactly as github-profile-3d-contrib
      # produced it and can still be used on its own.
      - name: Overlay snake on the night view
        run: |
          node scripts/snake-overlay.mjs \
            profile-3d-contrib/profile-night-view.svg \
            profile-3d-contrib/profile-night-view-snake.svg

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all profile-3d-contrib
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate 3D contribution graph"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push attempt $i lost a race, retrying"; sleep 5
          done
          exit 1
