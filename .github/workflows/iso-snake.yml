name: Generate Isometric Snake

on:
  schedule:
    - cron: "30 1 * * *"  # Daily, between the 3D graph and metrics
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"  # needs global fetch

      - name: Render iso-snake
        run: node scripts/iso-snake.mjs "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all iso-snake
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate isometric snake"
          git push
